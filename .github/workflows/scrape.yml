name: Nightly Review Scraper

on:
  schedule:
    # 6:30 PM UTC = 12:00 AM IST (midnight India time)
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python package
        run: pip install playwright

      - name: Install Chromium browser + system deps
        run: |
          # Try method 1: playwright's own installer (works on most ubuntu runners)
          if python -m playwright install --with-deps chromium; then
            echo "✓ Method 1 succeeded (playwright install --with-deps)"
          else
            echo "Method 1 failed — trying method 2 (separate sudo install-deps)..."
            python -m playwright install chromium
            sudo python -m playwright install-deps chromium || true
          fi

          # Verify chromium binary exists
          python -c "
from playwright.sync_api import sync_playwright
with sync_playwright() as p:
    b = p.chromium.launch(headless=True, args=['--no-sandbox'])
    b.close()
print('Chromium launch test: OK')
"

      - name: Run scraper (attempt 1)
        id: attempt1
        run: python scripts/scraper.py
        continue-on-error: true

      - name: Wait before retry
        if: steps.attempt1.outcome == 'failure'
        run: |
          echo "Attempt 1 failed — waiting 60s..."
          sleep 60

      - name: Run scraper (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        run: python scripts/scraper.py
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed — waiting 120s..."
          sleep 120

      - name: Run scraper (attempt 3)
        id: attempt3
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: python scripts/scraper.py
        continue-on-error: true

      - name: Check if all attempts failed
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' && steps.attempt3.outcome == 'failure'
        run: echo "WARNING — All 3 attempts failed. Committing whatever data exists."

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/reviews.json
          git add docs/data/backups/ || true
          git diff --staged --quiet || git commit -m "data: update reviews $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
