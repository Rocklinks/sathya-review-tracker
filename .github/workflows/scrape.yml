name: Nightly Review Scraper

on:
  schedule:
    # 6:30 PM UTC = 12:00 AM IST (midnight India time)
    - cron: '30 18 * * *'
  workflow_dispatch:
    # Manual trigger from Actions tab anytime

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run scraper
        run: python scripts/scraper.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/reviews.json
          git add docs/data/backups/
          git diff --staged --quiet || git commit -m "data: update reviews $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
