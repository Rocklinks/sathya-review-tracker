name: Nightly Review Scraper

on:
  schedule:
    - cron: '0 19 * * *'   # 12:30 AM IST (19:00 UTC)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual run reason'
        required: false
        default: 'Manual trigger'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for Chromium/Playwright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            chromium-browser \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 \
            libcairo2 libcups2 || true

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium || true

      - name: Run scraper attempt 1
        id: attempt1
        run: python scripts/scraper.py
        continue-on-error: true

      - name: Wait before retry
        if: steps.attempt1.outcome == 'failure'
        run: sleep 60

      - name: Run scraper attempt 2
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        run: python scripts/scraper.py
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: sleep 120

      - name: Run scraper attempt 3
        id: attempt3
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: python scripts/scraper.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/reviews.json
          git add docs/data/backups/ || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update reviews $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
