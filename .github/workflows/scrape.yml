name: Nightly Review Scraper

on:
  schedule:
    - cron: '30 18 * * *'   # 6:30 PM UTC = 12:00 AM IST
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chromium via apt (most reliable on Ubuntu runners)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          which chromium-browser || which chromium
          echo "Chromium installed ✓"

      - name: Install Playwright (Python only, no browser download needed)
        run: |
          pip install playwright
          # Point playwright to the system chromium — no download needed
          python -m playwright install chromium || true

      - name: Verify Chromium can launch
        run: python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage']); b.close(); p.stop(); print('Chromium launch test: OK')"

      - name: Run scraper (attempt 1)
        id: attempt1
        run: python scripts/scraper.py
        continue-on-error: true

      - name: Wait before retry
        if: steps.attempt1.outcome == 'failure'
        run: sleep 60

      - name: Run scraper (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        run: python scripts/scraper.py
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: sleep 120

      - name: Run scraper (attempt 3)
        id: attempt3
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: python scripts/scraper.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/reviews.json
          git add docs/data/backups/ || true
          git diff --staged --quiet || git commit -m "data: update reviews $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
