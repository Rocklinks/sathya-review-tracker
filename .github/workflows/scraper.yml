name: Daily Scrape
on:
  schedule:
    - cron: '30 18 * * *'   # 12:00 AM IST = 18:30 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scraper-push
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install playwright && playwright install chromium --with-deps
      - run: python scripts/scraper.py
      - run: |
          git config user.name "scraper-bot"
          git config user.email "bot@sathya"
          git add docs/data/
          git diff --cached --quiet || (git commit -m "scrape $(date -u +%Y-%m-%d)" && git fetch origin main && git push --force-with-lease origin main)
