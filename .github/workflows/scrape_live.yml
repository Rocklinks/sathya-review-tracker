name: Run Live Scraper
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make start.sh executable
        run: chmod +x start.sh

      - name: Run start.sh (setup environment)
        run: ./start.sh

      - name: Install Jupyter & dependencies
        run: |
          pip install jupyter playwright
          playwright install chromium --with-deps

      - name: Run sathya_jupyter.html (Playwright scraper)
        run: |
          # Convert HTML notebook to Python script & execute
          jupyter nbconvert --to python sathya_jupyter.ipynb --stdout | python
          
      # Alternative if it's already a .py file:
      # - name: Run sathya_jupyter
      #   run: python sathya_jupyter.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: live scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
