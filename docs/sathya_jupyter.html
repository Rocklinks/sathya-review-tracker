const SERVER = "https://web-production-e3a4d.up.railway.app";

async function simulateRun(script, onLine) {
  const now       = new Date();
  const dateStr   = now.toISOString().replace("T"," ").substring(0,19);
  const dateLabel = now.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase();

  const emit = (text, type="normal") =>
    new Promise(r => setTimeout(() => { onLine({text, type}); r(); }, 0));

  await emit("=".repeat(60), "muted");
  await emit("  SATHYA AGENCIES — Live Review Tracker", "bold");
  await emit(`  Script : ${script.label}`, "muted");
  await emit(`  AGM    : ${script.agm}  (${script.branches.length} branches)`, "muted");
  await emit(`  Time   : ${dateStr}`, "muted");
  await emit("=".repeat(60), "muted");
  await emit("", "normal");

  // Check server
  try {
    const r = await fetch(`${SERVER}/status`, {signal: AbortSignal.timeout(5000)});
    if (!r.ok) throw new Error("status " + r.status);
  } catch(e) {
    await emit("  ❌  Railway server not reachable: " + e.message, "error");
    await emit("  URL: " + SERVER, "muted");
    await emit("  Check Railway dashboard — service may be sleeping.", "muted");
    await emit("=".repeat(60), "muted");
    return;
  }

  await emit(`  🌐 Playwright scraping ${script.agm} — ${script.branches.length} branches...`, "accent");
  await emit("", "normal");

  await new Promise(resolve => {
    const es = new EventSource(`${SERVER}/scrape/${encodeURIComponent(script.agm)}`);

    es.onmessage = e => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.event === "log")  onLine({text: msg.text, type: msg.type || "normal"});
      if (msg.event === "done") { es.close(); resolve(); }
    };

    es.onerror = () => {
      es.close();
      onLine({text: "  ⚠  Stream error — Railway may have timed out.", type: "error"});
      resolve();
    };
  });
}

function OutputLine({ text, type }) {
  const styles = {
    normal:  { color: "#1e293b" },
    muted:   { color: "#94a3b8" },
    bold:    { color: "#0f172a", fontWeight: 700 },
    success: { color: "#15803d" },
    error:   { color: "#b91c1c" },
    accent:  { color: "#1d4ed8" },
  };
  return (
    <div style={{
      fontFamily: "'Courier New', Courier, monospace",
      fontSize: "12.5px",
      lineHeight: "1.75",
      whiteSpace: "pre",
      ...styles[type || "normal"],
    }}>
      {text || "\u00a0"}
    </div>
  );
}

function Cell({ script, index, runCount }) {
  const [status, setStatus] = useState("idle");
  const [lines, setLines] = useState([]);
  const [execNum, setExecNum] = useState(null);
  const outputRef = useRef(null);
  const globalCount = useRef(runCount);

  const run = async () => {
    if (status === "running") return;
    setStatus("running");
    setLines([]);
    const num = ++globalCount.current;
    setExecNum(num);

    await simulateRun(script, (line) => {
      setLines(prev => [...prev, line]);
      setTimeout(() => {
        if (outputRef.current) {
          outputRef.current.scrollTop = outputRef.current.scrollHeight;
        }
      }, 10);
    });

    setStatus("done");
  };

        alignItems: "center",
        paddingTop: 10,
        gap: 4,

          onClick={run}
          disabled={status === "running"}
          style={{
            width: 28,
            height: 28,
            borderRadius: "50%",
            border: `1.5px solid ${status === "running" ? "#e2e8f0" : accentColor + "55"}`,
            background: status === "running" ? "#f8fafc" : "white",
            cursor: status === "running" ? "not-allowed" : "pointer",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            color: status === "running" ? "#94a3b8" : accentColor,
            transition: "all 0.15s",
            padding: 0,
          }}
        >
          {status === "running" ? (
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" style={{ animation: "jupy-spin 0.9s linear infinite" }}>
              <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" strokeWidth="1.5" strokeDasharray="18" strokeDashoffset="6" />
            </svg>
          ) : (
            <svg width="10" height="11" viewBox="0 0 10 11" fill={accentColor}>
              <path d="M1 1 L9 5.5 L1 10 Z" />
            </svg>
          )}
        </button>

        <span style={{
          fontFamily: "monospace",
          fontSize: "10px",
          color: "#94a3b8",
          letterSpacing: "0.3px",
        }}>
          {execNum ? `[${execNum}]` : "[ ]"}
        </span>
      </div>

      {/* Cell body */}
      <div style={{ flex: 1, minWidth: 0 }}>
        {/* Code area */}
        <div style={{
          border: `1px solid ${status === "running" ? accentColor : "#d1d5db"}`,
          borderRadius: "4px 4px 0 0",
          background: status === "running" ? "#fffbeb" : "#f8fafc",
          padding: "10px 16px",
          borderBottom: "none",
          transition: "border-color 0.2s",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          gap: 12,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{
              fontFamily: "'Courier New', monospace",
              fontSize: "13px",
              color: "#1e3a5f",
              fontWeight: 600,
            }}>
              <span style={{ color: "#7c3aed" }}>import</span>{" "}
              <span style={{ color: "#0369a1" }}>playwright</span>
              {"  # "}
              <span style={{ color: "#64748b" }}>{script.label}</span>
            </span>
            <span style={{
              fontSize: "10px",
              background: accentColor + "18",
              color: accentColor,
              border: `1px solid ${accentColor}35`,
              borderRadius: "4px",
              padding: "1px 8px",
              fontFamily: "monospace",
              fontWeight: 600,
            }}>
              AGM: {script.agm}
            </span>
            <span style={{
              fontSize: "10px",
              color: "#94a3b8",
              fontFamily: "monospace",
            }}>
              {script.branches.length} branches
            </span>
          </div>
          <span style={{
            fontSize: "10px",
            color: status === "done" ? "#15803d" : status === "running" ? accentColor : "#94a3b8",
            fontFamily: "monospace",
            fontWeight: 600,
          }}>
            {status === "done" ? "● done" : status === "running" ? "● running" : "○ idle"}
          </span>
        </div>

        {/* Output area */}
        {(lines.length > 0 || status === "running") && (
          <div
            ref={outputRef}
            style={{
              border: "1px solid #d1d5db",
              borderTop: "1px dashed #e5e7eb",
              borderRadius: "0 0 4px 4px",
              background: "white",
              padding: "10px 16px",
              maxHeight: "300px",
              overflowY: "auto",
            }}
          >
            {lines.length === 0 && status === "running" && (
              <div style={{ color: "#94a3b8", fontFamily: "monospace", fontSize: "12px" }}>
                Launching chromium...
              </div>
            )}
            {lines.map((line, i) => (
              <OutputLine key={i} text={line.text} type={line.type} />
            ))}
            {status === "running" && lines.length > 0 && (
              <span style={{
                display: "inline-block",
                width: 7,
                height: 13,
                background: "#1e293b",
                marginLeft: 2,
                verticalAlign: "middle",
                animation: "jupy-blink 1s step-end infinite",
              }} />
            )}
          </div>
        )}

        {/* No output yet */}
        {lines.length === 0 && status === "idle" && (
          <div style={{
            border: "1px solid #e5e7eb",
            borderTop: "1px dashed #e5e7eb",
            borderRadius: "0 0 4px 4px",
            background: "white",
            padding: "8px 16px",
            color: "#cbd5e1",
            fontFamily: "monospace",
            fontSize: "11px",
          }}>
            # No output yet — click ▶ to run
          </div>
        )}
      </div>
    </div>
  );
}
