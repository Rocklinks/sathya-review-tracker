/* ─── Excel helpers ─────────────────────────────────────────────────────── */

function applyTableStyle(ws, rowCount, colCount) {
  const thin = { style: "thin", color: { rgb: "AAAAAA" } };
  const border = { top: thin, bottom: thin, left: thin, right: thin };

  for (let r = 0; r < rowCount; r++) {
    for (let c = 0; c < colCount; c++) {
      const addr = XLSX.utils.encode_cell({ r, c });
      if (!ws[addr]) ws[addr] = { v: "", t: "s" };
      const isHeader = r === 0;
      ws[addr].s = {
        border,
        alignment: { horizontal: "center", vertical: "center", wrapText: true },
        font: isHeader
          ? { bold: true, sz: 11, color: { rgb: "FFFFFF" } }
          : { sz: 11 },
        fill: isHeader
          ? { fgColor: { rgb: "1E3A5F" }, patternType: "solid" }
          : r % 2 === 0
            ? { fgColor: { rgb: "EEF2FA" }, patternType: "solid" }
            : { fgColor: { rgb: "FFFFFF" }, patternType: "solid" },
      };
    }
  }
}

function buildSheet(results) {
  const headers = ["Branch", "Reviews", "Stars", "Status"];
  const rows = [
    headers,
    ...results.map(r => [
      r.branch,
      r.reviews === 0 ? "FAILED" : r.reviews,
      r.stars,
      r.status,
    ]),
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 26 }, { wch: 14 }, { wch: 10 }, { wch: 10 }];
  ws["!rows"] = rows.map((_, i) => ({ hpt: i === 0 ? 22 : 18 }));
  applyTableStyle(ws, rows.length, headers.length);
  return ws;
}

/* ─── simulateRun ───────────────────────────────────────────────────────── */

async function simulateRun(script, onLine) {
  const now = new Date();
  const dateStr   = now.toISOString().replace("T", " ").substring(0, 19);
  const dateLabel = now.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();

  const emit = (text, type = "normal") =>
    new Promise((r) => setTimeout(() => { onLine({ text, type }); r(); }, 0));

  await emit("=".repeat(60), "muted");
  await emit("  SATHYA AGENCIES — Free Review Tracker", "bold");
  await emit(`  Running: ${dateStr}`, "muted");
  await emit(`  Date:    ${dateLabel}`, "muted");
  await emit("=".repeat(60), "muted");
  await emit("");
  await emit(`🌐 Opening browser and fetching ${script.branches.length} branches...`, "accent");
  await emit("");

  const prompt = `Generate realistic mock Google Maps review data for Sathya Agencies branches in Tamil Nadu.
Branches: ${script.branches.map(b => b.name).join(", ")}
Respond ONLY with a valid JSON array, no markdown:
[{"name":"BranchName","reviews":1234,"stars":4.5}]
Rules: reviews 800-8000, stars 3.8-4.9 (one decimal), realistic variation.`;

  let branchData = [];
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 500,
        messages: [{ role: "user", content: prompt }],
      }),
    });
    const data = await response.json();
    const text = data.content?.[0]?.text || "[]";
    branchData = JSON.parse(text.replace(/```json|```/g, "").trim());
  } catch {
    branchData = script.branches.map((b) => ({
      name: b.name,
      reviews: Math.floor(Math.random() * 5000) + 1000,
      stars: parseFloat((Math.random() * 1.0 + 3.9).toFixed(1)),
    }));
  }

  let total = 0;
  const failed  = [];
  const results = [];

  for (let i = 0; i < script.branches.length; i++) {
    const b     = script.branches[i];
    const found = branchData.find((d) => d.name === b.name) || {
      reviews: Math.floor(Math.random() * 3000) + 1000,
      stars:   parseFloat((Math.random() * 1.0 + 4.0).toFixed(1)),
    };
    const pad     = String(i + 1).padStart(2, "0");
    const success = Math.random() > 0.05;
    await new Promise(r => setTimeout(r, 280));
    if (success) {
      total += found.reviews;
      results.push({ branch: b.name, reviews: found.reviews, stars: found.stars, status: "✓" });
      await emit(
        `  [${pad}/${script.branches.length}] ${b.name.padEnd(22)} →  ${found.reviews.toLocaleString()} reviews  ${found.stars}⭐  ✓`,
        "success"
      );
    } else {
      failed.push(b.name);
      results.push({ branch: b.name, reviews: 0, stars: "-", status: "FAILED" });
      await emit(
        `  [${pad}/${script.branches.length}] ${b.name.padEnd(22)} →  FAILED ✗`,
        "error"
      );
    }
  }

  await emit("");
  await emit("─".repeat(60), "muted");
  await emit(`  ✅ Fetched: ${script.branches.length - failed.length}/${script.branches.length} branches`, "success");
  if (failed.length > 0) await emit(`  ❌ Failed:  ${failed.join(", ")}`, "error");
  await emit("");
  await emit("📊 Excel ready — click ⬇ Download Excel below", "muted");
  await emit("🖥️  Dashboard update skipped (dashboard.html not found)", "muted");
  await emit("");
  await emit("=".repeat(60), "muted");
  await emit("  🎉 ALL DONE!", "bold");
  await emit(`  Total reviews across all branches: ${total.toLocaleString()}`, "bold");
  await emit("=".repeat(60), "muted");

  return { results, total, dateStr, dateLabel };
}

/* ─── OutputLine ─────────────────────────────────────────────────────────── */

function OutputLine({ text, type }) {
  const styles = {
    normal:  { color: "#1e293b" },
    muted:   { color: "#94a3b8" },
    bold:    { color: "#0f172a", fontWeight: 700 },
    success: { color: "#15803d" },
    error:   { color: "#b91c1c" },
    accent:  { color: "#1d4ed8" },
  };
  return (
    <div style={{
      fontFamily: "'Courier New', Courier, monospace",
      fontSize: "12.5px",
      lineHeight: "1.75",
      whiteSpace: "pre",
      ...styles[type || "normal"],
    }}>
      {text || "\u00a0"}
    </div>
  );
}

/* ─── Cell ───────────────────────────────────────────────────────────────── */

function Cell({ script, runCount, selected, onToggleSelect, onDataReady }) {
  const [status,  setStatus]  = useState("idle");
  const [lines,   setLines]   = useState([]);
  const [execNum, setExecNum] = useState(null);
  const [runData, setRunData] = useState(null);
  const outputRef   = useRef(null);
  const globalCount = useRef(runCount);

  const run = async () => {
    if (status === "running") return;
    setStatus("running");
    setLines([]);
    setRunData(null);
    onDataReady(script.id, null);
    const num = ++globalCount.current;
    setExecNum(num);

    const result = await simulateRun(script, (line) => {
      setLines(prev => [...prev, line]);
      setTimeout(() => {
        if (outputRef.current)
          outputRef.current.scrollTop = outputRef.current.scrollHeight;
      }, 10);
    });

    setRunData(result);
    onDataReady(script.id, result);
    setStatus("done");
  };

  const downloadExcel = () => {
    if (!runData) return;
    const { results, dateLabel } = runData;
    const wb = XLSX.utils.book_new();
    const ws = buildSheet(results);
    XLSX.utils.book_append_sheet(wb, ws, script.label.replace(".py", ""));
    XLSX.writeFile(wb, `${script.label.replace(".py", "")}_reviews_${dateLabel.replace(/ /g, "_")}.xlsx`);
  };

  const accentColor = KERNEL_COLORS[script.agm] || "#6366f1";

  return (

        display: "flex",
        flexDirection: "column",
        alignItems: "center",

        gap: 4,

          onClick={run}
          disabled={status === "running"}
          style={{
            width: 28,
            height: 28,
            borderRadius: "50%",
            border: `1.5px solid ${status === "running" ? "#e2e8f0" : accentColor + "55"}`,
            background: status === "running" ? "#f8fafc" : "white",
            cursor: status === "running" ? "not-allowed" : "pointer",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            color: status === "running" ? "#94a3b8" : accentColor,
            transition: "all 0.15s",
            padding: 0,

        >

              <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" strokeWidth="1.5" strokeDasharray="18" strokeDashoffset="6" />

            <svg width="10" height="11" viewBox="0 0 10 11" fill={accentColor}>
              <path d="M1 1 L9 5.5 L1 10 Z" />

        <span style={{

          color: "#94a3b8",
          letterSpacing: "0.3px",

          {execNum ? `[${execNum}]` : "[ ]"}

      {/* Cell body */}

        {/* Code area */}

/* ─── App ────────────────────────────────────────────────────────────────── */

function App() {
  const runCounter = useRef(0);

  // Which script IDs are checked for combined download
  const [selected, setSelected] = useState(() => new Set(SCRIPTS.map(s => s.id)));

  // Completed run data keyed by script id
  const [allData, setAllData] = useState({});

  const allSelected  = selected.size === SCRIPTS.length;
  const someSelected = selected.size > 0 && !allSelected;

  const toggleSelectAll = () => {
    setSelected(allSelected ? new Set() : new Set(SCRIPTS.map(s => s.id)));
  };

  const toggleSelect = (id) => {
    setSelected(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const onDataReady = useCallback((id, data) => {
    setAllData(prev => ({ ...prev, [id]: data }));
  }, []);

  // Count selected scripts that have completed data
  const readyCount = [...selected].filter(id => allData[id]).length;

  const downloadAll = () => {
    const now = new Date();
    const dateLabel = now
      .toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" })
      .toUpperCase();

    const wb = XLSX.utils.book_new();

    SCRIPTS.forEach(script => {
      if (!selected.has(script.id)) return;
      const data = allData[script.id];
      if (!data) return;
      const ws = buildSheet(data.results);
      XLSX.utils.book_append_sheet(wb, ws, script.label.replace(".py", ""));
    });

    if (wb.SheetNames.length === 0) return;
    XLSX.writeFile(wb, `sathya_all_reviews_${dateLabel.replace(/ /g, "_")}.xlsx`);
  };

  return (
    <div style={{
      minHeight: "100vh",
      background: "#f9fafb",
      fontFamily: "system-ui, -apple-system, sans-serif",
    }}>
      <style>{`
        @keyframes jupy-spin {
          from { transform: rotate(0deg); }
          to   { transform: rotate(360deg); }
        }
        @keyframes jupy-blink {
          0%, 100% { opacity: 1; }
          50%       { opacity: 0; }
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      `}</style>

      {/* Top bar */}
      <div style={{
        background: "white",
        borderBottom: "1px solid #e5e7eb",
        padding: "0 24px",
        display: "flex",
        alignItems: "center",
        height: "44px",
        gap: 14,

        {/* Select All checkbox */}

          <input
            type="checkbox"
            checked={allSelected}
            ref={el => { if (el) el.indeterminate = someSelected; }}
            onChange={toggleSelectAll}
            style={{ width: 14, height: 14, accentColor: "#1d4ed8", cursor: "pointer" }}
          />
          Select All
        </label>

        {/* Divider */}
        <div style={{ width: 1, height: 20, background: "#e5e7eb" }} />

        {/* Download All Selected */}
        <button
          onClick={downloadAll}
          disabled={readyCount === 0}
          title={readyCount === 0 ? "Run selected scripts first" : `Download ${readyCount} script(s) into one Excel`}
          style={{
            display: "flex",
            alignItems: "center",
            gap: 6,
            padding: "5px 14px",
            background: readyCount === 0 ? "#f1f5f9" : "#1d4ed8",
            color: readyCount === 0 ? "#9ca3af" : "white",
            border: `1px solid ${readyCount === 0 ? "#e5e7eb" : "#1d4ed8"}`,
            borderRadius: "5px",
            fontSize: "12px",
            fontWeight: 600,
            cursor: readyCount === 0 ? "not-allowed" : "pointer",
            transition: "background 0.15s",
          }}
          onMouseOver={e => { if (readyCount > 0) e.currentTarget.style.background = "#1e40af"; }}
          onMouseOut={e => { if (readyCount > 0) e.currentTarget.style.background = "#1d4ed8"; }}
        >
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M6.5 1v7M4 6l2.5 2.5L9 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M2 10h9" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
          Download All Selected
          {readyCount > 0 && (
            <span style={{
              background: "rgba(255,255,255,0.22)",
              borderRadius: "10px",
              padding: "1px 7px",
              fontSize: "10px",
              fontWeight: 700,
            }}>
              {readyCount}
            </span>
          )}
        </button>

        <div style={{ flex: 1 }} />

        <div style={{
          fontSize: "11px",
          color: "#94a3b8",
          fontFamily: "monospace",
          display: "flex",
          alignItems: "center",
          gap: 6,
        }}>
          <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#22c55e" }} />
          Python 3 (ipykernel)
        </div>
      </div>

      {/* Notebook body */}
      <div style={{
        maxWidth: "960px",
        margin: "0 auto",
        padding: "24px 0 60px 0",
      }}>
        {/* Title cell */}
        <div style={{ display: "flex", gap: 0, marginBottom: "0px" }}>
          <div style={{ width: 56, flexShrink: 0 }} />
          <div style={{
            flex: 1,
            padding: "10px 16px",
            background: "white",
            border: "1px solid #e5e7eb",
            borderLeft: "4px solid #3b82f6",
            borderRadius: "4px",
            marginBottom: "2px",
          }}>
            <div style={{ fontSize: "18px", fontWeight: 700, color: "#0f172a", marginBottom: 4 }}>
              🏪 Google Review Tracker
            </div>
            <div style={{ fontSize: "12.5px", color: "#64748b", fontFamily: "monospace" }}>
              Playwright · Chromium Headless · Tamil Nadu Branches · Output-only mode
            </div>
          </div>
        </div>

        <div style={{ height: 12 }} />

        {/* Code cells */}
        {SCRIPTS.map((script, i) => (
          <div key={script.id} style={{ marginBottom: "3px" }}>
            <Cell
              script={script}
              index={i}
              runCount={runCounter}
              selected={selected.has(script.id)}
              onToggleSelect={toggleSelect}
              onDataReady={onDataReady}
            />
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
