    :root {
      --navy: #0f172a;
      --navy-mid: #1e293b;
      --navy-light: #334155;
      --slate: #64748b;
      --slate-light: #94a3b8;
      --border: #e2e8f0;
      --bg: #f1f5f9;
      --white: #ffffff;
      --green: #059669;
      --green-bg: rgba(5,150,105,.1);
      --red: #e11d48;
      --red-bg: rgba(225,29,72,.08);
      --blue: #2563eb;
      --indigo: #4f46e5;
      --indigo-bg: rgba(79,70,229,.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--navy);
      min-height: 100vh;
    }

    /* ── NAV ── */
    .sa-nav {
      background: var(--navy);
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 300;
      box-shadow: 0 2px 12px rgba(0,0,0,.3);
      gap: 0;
    }
    .sa-nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-right: 16px;
      border-right: 1px solid rgba(255,255,255,.12);
      flex-shrink: 0;
    }
    .sa-nav-brand img { height: 26px; object-fit: contain; }
    .sa-nav-brand span {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .5px;
      white-space: nowrap;
    }
    .sa-nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      padding-left: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .sa-nav-links::-webkit-scrollbar { display: none; }
    .sa-nav-links a {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.65);
      transition: all .15s;
      white-space: nowrap;
    }
    .sa-nav-links a:hover { background: rgba(255,255,255,.12); color: #fff; }
    .sa-nav-links .active { background: rgba(255,255,255,.12); color: #fff; }
    .sa-nav-right {
      margin-left: auto;
      font-size: 10px;
      color: rgba(255,255,255,.3);
      letter-spacing: .5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      position: sticky;
      top: 52px;
      z-index: 100;
      flex-wrap: wrap;
      padding-top: 6px;
      padding-bottom: 6px;
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn-dark  { background: var(--navy);  color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-red   { background: var(--red);   color: #fff; }
    .btn-blue  { background: var(--blue);  color: #fff; }

    /* ── NOTEBOOK WRAPPER ── */
    .notebook {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 12px 80px;
    }

    /* ── NOTEBOOK HEADER CARD ── */
    .nb-header {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--blue);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .nb-header h1 { font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
    .nb-header p  { font-size: 12px; color: var(--slate); font-family: 'JetBrains Mono', monospace; }

    /* ── CELL ── */
    .cell {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
      transition: box-shadow .2s, border-color .2s;
    }
    .cell.running {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(37,99,235,.08);
    }

    /* ── CELL HEADER ── */
    .cell-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px;
    }
    .cell-check {
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
      accent-color: var(--blue);
    }
    .cell-run-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all .15s;
    }
    .cell-run-btn:hover:not(:disabled) {
      border-color: currentColor;
      background: #f0f9ff;
    }
    .cell-run-btn:disabled { cursor: not-allowed; opacity: .5; }

    .cell-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
    .cell-title { font-size: 13px; font-weight: 600; color: var(--navy); font-family: 'JetBrains Mono', monospace; }
    .cell-badge {
      font-size: 11px;
      border-radius: 6px;
      padding: 2px 9px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }
    .cell-count { font-size: 11px; color: var(--slate-light); font-family: 'JetBrains Mono', monospace; }
    .cell-status {
      margin-left: auto;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── OUTPUT ── */
    .cell-output {
      background: #fafbfc;
      border-bottom: 1px dashed var(--border);
      padding: 12px 16px;
      max-height: 260px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.8;
    }
    .cell-empty {
      padding: 10px 16px;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    /* ── RESULTS TABLE ── */
    .results-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 420px;
    }
    .results-table th {
      padding: 9px 12px;
      text-align: left;
      font-weight: 600;
      color: var(--slate);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .results-table th:not(:first-child) { text-align: center; }
    .results-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    .results-table td:not(:first-child) { text-align: center; }
    .results-table tr:last-child td { border-bottom: none; }
    .results-table tbody tr:nth-child(even) { background: #f8fafc; }
    .results-table tfoot td {
      background: #f1f5f9;
      border-top: 2px solid var(--border);
      font-weight: 700;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 12px;
    }
    .badge-indigo { background: var(--indigo-bg); color: var(--indigo); }
    .badge-green  { background: var(--green-bg);  color: var(--green);  }
    .badge-red    { background: var(--red-bg);    color: var(--red);    }
    .badge-gray   { background: #f1f5f9; color: var(--slate-light); border: 1px solid var(--border); }

    /* Download bar */
    .dl-bar {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding: 10px 16px;
      border-top: 1px solid #f1f5f9;
      flex-wrap: wrap;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 16px;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--slate-light);
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* ── SCROLLBARS ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* ── ANIMATIONS ── */
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
    .spin { animation: spin .9s linear infinite; }
    .blink { animation: blink 1s step-end infinite; }

    /* ── STATUS DOT ── */
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      box-shadow: 0 0 0 2px rgba(34,197,94,.2);

    /* ── MOBILE TWEAKS ── */
    @media (max-width: 600px) {
      .sa-nav-brand span, .sa-nav-right { display: none; }
      .toolbar { top: 52px; gap: 6px; }
      .toolbar-label { display: none; }
      .btn { padding: 6px 11px; font-size: 12px; }
      .notebook { padding: 12px 8px 80px; }
      .nb-header h1 { font-size: 17px; }
      .cell-title { font-size: 12px; }
      .cell-header { padding: 10px 12px; }
      .results-table { font-size: 12px; }
      .results-table th, .results-table td { padding: 8px 10px; }
    }
  </style>
</head>

function buildSheet(rows, label, baseline) {
  const headers = ["Branch", "Total Reviews", "Today's Reviews", "Stars", "Star Change", "Status"];
  const data = [headers, ...rows.map(r => {
    const prev      = (baseline && baseline[r.name]) || {};
    const prevRev   = prev.reviews || 0;
    const prevStar  = prev.stars   || 0;
    const today     = prevRev > 0 ? (r.reviews || 0) - prevRev : "no baseline";
    const starChange= (prevStar > 0 && r.stars > 0 && Math.abs(r.stars - prevStar) >= 0.1)
                      ? `${prevStar} → ${r.stars}` : "";
    return [
      r.name,
      r.reviews  || 0,
      typeof today === "number" ? (today >= 0 ? `+${today}` : `${today}`) : today,
      r.stars    || "—",
      starChange,
      r.status === "ok" ? "✓" : "FAILED",
    ];
  })];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws["!cols"] = [{wch:24},{wch:14},{wch:16},{wch:8},{wch:14},{wch:10}];
  const thin = {style:"thin",color:{rgb:"BBBBBB"}};
  const border = {top:thin,bottom:thin,left:thin,right:thin};
  for (let r=0;r<data.length;r++) for (let c=0;c<headers.length;c++) {
    const addr = XLSX.utils.encode_cell({r,c});
    if (!ws[addr]) ws[addr]={v:"",t:"s"};
    ws[addr].s = {
      border,
      alignment:{horizontal:"center",vertical:"center"},
      font: r===0 ? {bold:true,sz:11,color:{rgb:"FFFFFF"}} : {sz:11},
      fill: r===0
        ? {fgColor:{rgb:"1E3A5F"},patternType:"solid"}
        : r%2===0
          ? {fgColor:{rgb:"EEF2FA"},patternType:"solid"}
          : {fgColor:{rgb:"FFFFFF"},patternType:"solid"},
    };
  }
  return ws;
}

function downloadExcel(script, results, baseline) {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, buildSheet(results, script.agm, baseline), script.agm.substring(0,31));
  XLSX.writeFile(wb, `${script.agm}_reviews_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function downloadAllExcel(scripts, allResults, baseline) {
  const wb = XLSX.utils.book_new();
  scripts.forEach(s => {
    const rows = allResults[s.id];
    if (rows && rows.length) {
      XLSX.utils.book_append_sheet(wb, buildSheet(rows, s.agm, baseline), s.agm.substring(0,31));
    }
  });
  if (!wb.SheetNames.length) return;
  XLSX.writeFile(wb, `Sathya_All_Reviews_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function buildPdfHtml(script, rows, dateStr, baseline, baseDate) {

  const color  = colMap[script.agm] || "#4f46e5";
  const total  = rows.reduce((a,r)=>a+(r.reviews||0),0);
  const ok     = rows.filter(r=>r.status==="ok").length;
  const hasBl  = baseline && rows.some(r=>baseline[r.name]);
  const todayTot = rows.reduce((a,r)=>{
    const prev = baseline && baseline[r.name];
    if (!prev || r.status!=="ok") return a;
    return a + ((r.reviews||0)-(prev.reviews||0));
  }, 0);
  const baseLine = baseDate ? `vs ${baseDate}` : "";

  const trs = rows.map((r,i)=>{

    const stChg   = prevSt>0&&(r.stars||0)>0&&Math.abs((r.stars||0)-prevSt)>=0.1;
    const stUp    = stChg&&(r.stars||0)>prevSt;
    const todayCell = !isOk ? "&mdash;"
      : diff===null ? "<span style='color:#94a3b8'>no baseline</span>"
      : diff>0  ? `<span style='color:#059669;font-weight:700'>+${diff}</span>`
      : diff<0  ? `<span style='color:#e11d48;font-weight:700'>${diff}</span>`
      : "<span style='color:#94a3b8'>0</span>";
    const starsCell = !isOk||(r.stars||0)===0 ? "&mdash;"
      : stChg
        ? `<span style='text-decoration:line-through;color:#94a3b8'>${prevSt}\u2605</span> &rarr; <span style='color:${stUp?"#059669":"#e11d48"};font-weight:700'>${r.stars}\u2605${stUp?"&#9650;":"&#9660;"}</span>`
        : `${r.stars}\u2605`;
    return `<tr style="background:${bg}">
      <td style="text-align:left;font-weight:600;color:#0f172a;padding:5px 8px;border-bottom:1px solid #e5e7eb">${r.name}</td>

  return `<!DOCTYPE html><html><head><meta charset="UTF-8">

@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:0}.page{padding:13mm 14mm 10mm}}
</style></head><body><div class="page">

<td></td>
</tr></tfoot></table></div>
<div class="footer"><span>Sathya Agencies &mdash; Live Review Tracker</span><span>Generated: ${dateStr}</span></div>
</div><script>var p=false;function go(){if(p)return;p=true;window.print();}
var img=document.querySelector('.logo');if(img){img.addEventListener('load',go);img.addEventListener('error',go);}setTimeout(go,1200);<\/script>
</body></html>`;
}

/* ── Output line ── */
function OutputLine({ text, type }) {
  const colors = {
    normal:  "#1e293b",
    muted:   "#94a3b8",
    bold:    "#0f172a",
    success: "#15803d",
    error:   "#b91c1c",
    accent:  "#1d4ed8",
  };
  return (
    <div style={{
      fontFamily: "'JetBrains Mono', 'Courier New', monospace",
      fontSize: "12px",
      lineHeight: "1.8",
      whiteSpace: "pre",
      color: colors[type || "normal"] || colors.normal,
      fontWeight: type === "bold" ? 700 : 400,
    }}>
      {text || "\u00a0"}
    </div>
  );
}

/* ── Cell ── */
function Cell({ script, runCount, selected, onSelect, onDone, runRef, baseline, baseDate }) {
  const [status,  setStatus]  = useState("idle");
  const [lines,   setLines]   = useState([]);
  const [execNum, setExecNum] = useState(null);
  const [results, setResults] = useState(null);
  const outputRef  = useRef(null);
  const globalCount= useRef(runCount);
  const accentColor= KERNEL_COLORS[script.agm] || "#6366f1";

  React.useEffect(()=>{ if(runRef) runRef.current = run; });

  const run = async () => {
    if (status === "running") return;
    setStatus("running");
    setLines([]);
    setResults(null);
    const num = ++globalCount.current;
    setExecNum(num);
    if (runRef) runRef.current = run;

    let capturedRows = [];

    await new Promise(async (resolve) => {
      const now     = new Date();
      const dateStr = now.toISOString().replace("T"," ").substring(0,19);

      function onLineAdd(line) {
        setLines(prev=>[...prev,line]);
        setTimeout(()=>{ if(outputRef.current) outputRef.current.scrollTop=outputRef.current.scrollHeight; },10);
      }

      const emit = (text, type="normal") => new Promise(r=>setTimeout(()=>{ onLineAdd({text,type}); r(); },0));

      await emit("=".repeat(56),"muted");
      await emit("  SATHYA AGENCIES — Live Review Tracker","bold");
      await emit(`  Script : ${script.label}`,"muted");
      await emit(`  AGM    : ${script.agm}  (${script.branches.length} branches)`,"muted");
      await emit(`  Time   : ${dateStr}`,"muted");
      await emit("=".repeat(56),"muted");
      await emit("","normal");

      try {
        const r = await fetch(`${SERVER}/status`,{signal:AbortSignal.timeout(8000)});
        if (!r.ok) throw new Error("HTTP "+r.status);
      } catch(e) {
        await emit("  ❌  Scraper server not reachable.","error");
        await emit(`     ${e.message}`,"muted");
        await emit("  Make sure your Hugging Face Space is running.","muted");
        await emit(`  Test: ${SERVER}/status`,"muted");
        await emit("=".repeat(56),"muted");
        resolve(); return;
      }

      await emit(`  🌐 Playwright scraping ${script.agm} — ${script.branches.length} branches...`,"accent");
      await emit("","normal");

      const REAL_AGMS = ["Seenivasan","Jeeva","Muthuselvam","John","Siva","Venkatesh"];
      const agmsToRun = script.agm === "All Branches" ? REAL_AGMS : [script.agm];

      for (const agm of agmsToRun) {
        if (agmsToRun.length > 1) onLineAdd({text:`  ── ${agm} ──`, type:"accent"});
        await new Promise(res2 => {
          const es = new EventSource(`${SERVER}/scrape/${encodeURIComponent(agm)}`);
          es.onmessage = e => {
            let msg; try{msg=JSON.parse(e.data);}catch{return;}
            if (msg.event==="log")    onLineAdd({text:msg.text,type:msg.type||"normal"});
            if (msg.event==="result") capturedRows = [...capturedRows, ...(msg.rows||[])];
            if (msg.event==="done")   { es.close(); res2(); }
          };
          es.onerror = ()=>{ es.close(); onLineAdd({text:`  ⚠  Stream disconnected (${agm}).`,type:"error"}); res2(); };
        });
      }
      resolve();
    });

    setResults(capturedRows);
    setStatus("done");
    onDone(script.id, capturedRows);
  };

  const statusColor = status==="done" ? "#059669" : status==="running" ? accentColor : "#94a3b8";
  const statusLabel = status==="done" ? "● done" : status==="running" ? "● running" : "○ idle";

  return (
    <div className={`cell${status==="running"?" running":""}`}>
      {/* Header */}
      <div className="cell-header">
        <input
          type="checkbox"
          className="cell-check"
          checked={selected}
          onChange={()=>onSelect(script.id)}
        />

        {/* Run button */}
        <button
          className="cell-run-btn"
          onClick={run}
          disabled={status==="running"}
          title="Run this script"
          style={{color: status==="running" ? "#94a3b8" : accentColor, borderColor: status==="running"?"#e2e8f0":accentColor+"55"}}
        >
          {status==="running"
            ? <svg className="spin" width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" strokeWidth="1.5" strokeDasharray="20" strokeDashoffset="7"/></svg>
            : <svg width="10" height="11" viewBox="0 0 10 11" fill="currentColor"><path d="M1 1 L9 5.5 L1 10 Z"/></svg>
          }
        </button>

        {/* Meta */}
        <div className="cell-meta">
          <span className="cell-title">
            <span style={{color:"#7c3aed"}}>run</span>
            {" "}
            <span style={{color:"#0369a1"}}>{script.label}</span>
          </span>
          <span
            className="cell-badge"
            style={{background: accentColor+"18", color: accentColor, border:`1px solid ${accentColor}33`}}
          >
            {script.agm}
          </span>
          <span className="cell-count">{script.branches.length} branches</span>
        </div>

        {/* Status */}
        <span className="cell-status" style={{color: statusColor}}>
          {statusLabel}
        </span>

        {/* Exec number */}
        {execNum && (
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"10px",color:"#94a3b8",flexShrink:0}}>[{execNum}]</span>
        )}
      </div>

      {/* Output area */}
      {(lines.length > 0 || status==="running") && (
        <div ref={outputRef} className="cell-output">
          {lines.length===0 && status==="running" && (
            <div style={{color:"#94a3b8"}}>Launching chromium...</div>
          )}
          {lines.map((line,i)=><OutputLine key={i} text={line.text} type={line.type}/>)}
          {status==="running" && lines.length > 0 && (
            <span className="blink" style={{display:"inline-block",width:7,height:13,background:"#1e293b",marginLeft:2,verticalAlign:"middle"}}/>
          )}
        </div>
      )}
      {lines.length===0 && status==="idle" && (
        <div className="cell-empty"># Click ▶ to scrape Google reviews for {script.branches.length} branch{script.branches.length!==1?"es":""}</div>
      )}

      {/* Results table */}
      {status==="done" && results && results.length > 0 && (
        <>
          <div className="results-wrap">
            <table className="results-table">
              <thead>
                <tr>
                  <th>Branch</th>
                  <th>Total Reviews</th>
                  <th>
                    Today's
                    {baseDate && <span style={{display:"block",fontSize:"9px",fontWeight:400,color:"#94a3b8",textTransform:"none"}}>vs {baseDate}</span>}
                  </th>
                  <th>Stars</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {results.map((r, i) => {
                  const prev     = baseline[r.name] || {};
                  const prevRev  = prev.reviews || 0;
                  const prevStar = prev.stars   || 0;
                  const curRev   = r.reviews    || 0;
                  const curStar  = r.stars      || 0;
                  const todayDiff= prevRev > 0 ? curRev - prevRev : null;
                  const starChanged = prevStar > 0 && curStar > 0 && Math.abs(curStar - prevStar) >= 0.1;
                  const starUp      = starChanged && curStar > prevStar;
                  const starDown    = starChanged && curStar < prevStar;
                  const isOk        = r.status === "ok";

                  let todayBadge;
                  if (!isOk)              todayBadge = <span style={{color:"#94a3b8"}}>—</span>;
                  else if (todayDiff===null) todayBadge = <span style={{fontSize:"11px",color:"#94a3b8",fontFamily:"'JetBrains Mono',monospace"}}>no baseline</span>;
                  else if (todayDiff>0)   todayBadge = <span className="badge badge-green">+{todayDiff}</span>;
                  else if (todayDiff<0)   todayBadge = <span className="badge badge-red">{todayDiff}</span>;
                  else                    todayBadge = <span className="badge badge-gray">0</span>;

                  let starsCell;
                  if (!isOk || !curStar) {
                    starsCell = <span style={{color:"#94a3b8"}}>—</span>;
                  } else if (starChanged) {
                    starsCell = (
                      <span style={{display:"inline-flex",alignItems:"center",gap:4}}>
                        <span style={{textDecoration:"line-through",color:"#94a3b8",fontSize:"11px"}}>{prevStar}★</span>
                        <span style={{fontSize:"10px",color:"#94a3b8"}}>→</span>
                        <span style={{fontWeight:700,color:starUp?"#059669":"#e11d48"}}>
                          {curStar}★ <span style={{fontSize:"9px"}}>{starUp?"▲":"▼"}</span>
                        </span>
                      </span>
                    );
                  } else {
                    starsCell = <span style={{fontFamily:"'JetBrains Mono',monospace",color:"#475569"}}>{curStar}★</span>;
                  }

                  return (
                    <tr key={r.name}>
                      <td style={{fontWeight:600,color:"#0f172a"}}>{r.name}</td>
                      <td>
                        {isOk
                          ? <span className="badge badge-indigo">{curRev.toLocaleString("en-IN")}</span>
                          : <span className="badge badge-gray">FAILED</span>
                        }
                      </td>
                      <td>{todayBadge}</td>
                      <td>{starsCell}</td>
                      <td>
                        <span style={{fontSize:"12px",fontWeight:700,color:isOk?"#059669":"#e11d48"}}>
                          {isOk?"✓ OK":"✗ FAIL"}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr>
                  <td style={{fontWeight:700,color:"#0f172a"}}>TOTAL</td>
                  <td>
                    <span className="badge badge-indigo" style={{fontWeight:700}}>
                      {results.filter(r=>r.status==="ok").reduce((a,r)=>a+(r.reviews||0),0).toLocaleString("en-IN")}
                    </span>
                  </td>
                  <td>
                    {(() => {
                      const total = results.filter(r=>r.status==="ok").reduce((a,r)=>{
                        const prev = baseline[r.name];
                        if (!prev) return a;
                        return a + ((r.reviews||0) - (prev.reviews||0));
                      }, 0);
                      const hasBl = results.some(r=>baseline[r.name]);
                      if (!hasBl) return <span style={{color:"#94a3b8",fontSize:"11px"}}>—</span>;
                      return total > 0
                        ? <span className="badge badge-green" style={{fontWeight:700}}>+{total}</span>
                        : total < 0
                        ? <span className="badge badge-red" style={{fontWeight:700}}>{total}</span>
                        : <span className="badge badge-gray" style={{fontWeight:700}}>0</span>;
                    })()}
                  </td>
                  <td colSpan={2}/>
                </tr>
              </tfoot>
            </table>
          </div>

          {/* Download bar */}
          <div className="dl-bar">
            <button className="btn btn-green" onClick={()=>downloadExcel(script,results,baseline)}>
              <svg width="12" height="12" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v7M4 6l2.5 2.5L9 6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><path d="M2 10h9" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
              Excel
            </button>
            <button className="btn btn-red" onClick={()=>openPdf(script,results,baseline,baseDate)}>
              PDF
            </button>
          </div>
        </>
      )}
    </div>
  );
}

/* ── Wrapper ── */
function CellWrapper({script, runCount, selected, onSelect, onDone, cellRefs, baseline, baseDate}) {
  const runRef = useRef(null);
  React.useEffect(()=>{ cellRefs.current[script.id] = ()=>{ if(runRef.current) runRef.current(); }; },[]);
  return <Cell script={script} runCount={runCount} selected={selected} onSelect={onSelect} onDone={onDone} runRef={runRef} baseline={baseline} baseDate={baseDate}/>;
}

/* ── App ── */
function App() {
  const runCounter  = useRef(0);
  const [selected,  setSelected]  = useState(new Set(ALL_SCRIPTS.map(s=>s.id)));
  const [allResults,setAllResults]= useState({});
  const [runAllBusy,setRunAllBusy]= useState(false);
  const [baseline,  setBaseline]  = useState({});
  const [baseDate,  setBaseDate]  = useState(null);
  const resolvers   = useRef({});
  const cellRefs    = useRef({});

  React.useEffect(() => {
    fetch("data/reviews.json?t=" + Date.now())
      .then(r => r.ok ? r.json() : null)
      .then(D => {
        if (!D || !D.daily) return;
        const nowIST  = new Date(Date.now() + (5.5 * 60 * 60 * 1000));
        const todayIST= nowIST.toISOString().slice(0, 10);
        const dates   = Object.keys(D.daily).sort().reverse();
        const prevDate= dates.find(d => d < todayIST) || dates[0];
        if (!prevDate) return;
        const snap    = D.daily[prevDate] || {};
        const bl = {};
        Object.entries(snap).forEach(([bid, val]) => {
          const branch = D.branches && D.branches[bid];
          if (branch) bl[branch.name] = { reviews: val.total_snap || 0, stars: val.star_rating || 0 };
        });
        setBaseline(bl);
        setBaseDate(prevDate);
      })
      .catch(() => {});
  }, []);

  const allSelected  = selected.size === ALL_SCRIPTS.length;
  const someSelected = selected.size > 0 && !allSelected;
  const selectedIds  = ALL_SCRIPTS.filter(s=>selected.has(s.id)).map(s=>s.id);
  const doneIds      = selectedIds.filter(id=>allResults[id]);
  const allDone      = selectedIds.length > 0 && doneIds.length === selectedIds.length;

  const toggleSelect = (id) => setSelected(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const toggleAll    = () => setSelected(allSelected?new Set():new Set(ALL_SCRIPTS.map(s=>s.id)));

  const onDone = React.useCallback((id, rows) => {
    setAllResults(p=>({...p,[id]:rows}));
    if (resolvers.current[id]) { resolvers.current[id](); delete resolvers.current[id]; }
  },[]);

  const runAll = async () => {
    if (runAllBusy || selectedIds.length===0) return;
    setRunAllBusy(true);
    setAllResults(p=>{ const n={...p}; selectedIds.forEach(id=>{n[id]=null;}); return n; });
    for (const id of selectedIds) {
      if (cellRefs.current[id]) cellRefs.current[id]();
      await new Promise(res=>{ resolvers.current[id]=res; });
      await new Promise(r=>setTimeout(r,400));
    }
    setRunAllBusy(false);
  };

  const selectedScripts = ALL_SCRIPTS.filter(s=>selected.has(s.id));

  return (
    <>
      {/* ── Toolbar ── */}
      <div className="toolbar">
        <img
          src="https://www.sathya.store/new_frontend/assets/img/sathya.webp"
          alt="Sathya"
          style={{height:26,objectFit:"contain"}}
          onError={e=>e.target.style.display="none"}
        />
        <span style={{fontSize:"13px",fontWeight:700,color:"#0f172a"}} className="toolbar-label">Live Tracker</span>

        {baseDate && (
          <span style={{fontSize:"10px",color:"#94a3b8",fontFamily:"'JetBrains Mono',monospace",background:"#f1f5f9",padding:"2px 8px",borderRadius:5}}>
            baseline: {baseDate}
          </span>
        )}

        <div style={{width:1,height:20,background:"#e2e8f0",flexShrink:0}}/>

        {/* Select All */}
        <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:"12px",fontWeight:600,color:"#374151",userSelect:"none",flexShrink:0}}>
          <input
            type="checkbox"
            checked={allSelected}
            ref={el=>{if(el)el.indeterminate=someSelected;}}
            onChange={toggleAll}
            style={{width:15,height:15,accentColor:"#1d4ed8",cursor:"pointer"}}
          />
          All
        </label>

        <div style={{width:1,height:20,background:"#e2e8f0",flexShrink:0}}/>

        {/* Run All */}
        <button
          className="btn btn-dark"
          disabled={selectedIds.length===0||runAllBusy}
          onClick={runAll}
        >
          {runAllBusy
            ? <><svg className="spin" width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" strokeWidth="1.5" strokeDasharray="20" strokeDashoffset="7"/></svg> Running…</>
            : <><svg width="10" height="11" viewBox="0 0 10 11" fill="currentColor"><path d="M1 1 L9 5.5 L1 10 Z"/></svg> Run ({selectedIds.length})</>
          }
        </button>

        <div style={{width:1,height:20,background:"#e2e8f0",flexShrink:0}}/>

        {/* Download All Excel */}
        <button
          className="btn btn-blue"
          disabled={!allDone}
          onClick={()=>downloadAllExcel(selectedScripts,allResults,baseline)}
        >
          <svg width="12" height="12" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v7M4 6l2.5 2.5L9 6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><path d="M2 10h9" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
          <span className="toolbar-label">Excel</span>{allDone?` (${doneIds.length})`:""}
        </button>

        {/* Download All PDF */}
        <button
          className="btn btn-red"
          disabled={!allDone}
          onClick={()=>openAllPdf(selectedScripts,allResults,baseline,baseDate)}
        >
          <span className="toolbar-label">PDF</span>{!allDone?"":""}
        </button>

        <div style={{flex:1,minWidth:4}}/>

        {/* Kernel status */}
        <div style={{display:"flex",alignItems:"center",gap:6,fontSize:"11px",color:"#94a3b8",fontFamily:"'JetBrains Mono',monospace",flexShrink:0}}>
          <span className="live-dot"/>
          <span className="toolbar-label">Python 3 (ipykernel)</span>
        </div>
      </div>

      {/* ── Notebook ── */}
      <div className="notebook">
        {/* Header card */}
        <div className="nb-header">
          <h1>🏪 Google Review Tracker</h1>
          <p>Playwright · Chromium Headless · {ALL_BRANCHES_SCRIPT.branches.length} branches · Tamil Nadu · Live scrape</p>
        </div>

        {/* All Branches cell */}
        <CellWrapper
          key={ALL_BRANCHES_SCRIPT.id}
          script={ALL_BRANCHES_SCRIPT}
          runCount={runCounter}
          selected={selected.has(ALL_BRANCHES_SCRIPT.id)}
          onSelect={toggleSelect}
          onDone={onDone}
          cellRefs={cellRefs}
          baseline={baseline}
          baseDate={baseDate}
        />

        {/* Divider */}
        <div className="divider">
          <div className="divider-line"/>
          <span className="divider-label">By AGM</span>
          <div className="divider-line"/>
        </div>

        {/* Per-AGM cells */}
        {SCRIPTS.map(script => (
          <div key={script.id} style={{marginBottom:8}}>
            <CellWrapper
              script={script}
              runCount={runCounter}
              selected={selected.has(script.id)}
              onSelect={toggleSelect}
              onDone={onDone}
              cellRefs={cellRefs}
              baseline={baseline}
              baseDate={baseDate}
            />
          </div>
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
