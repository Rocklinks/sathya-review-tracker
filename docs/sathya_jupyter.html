async function simulateRun(script, onLine) {
  const now       = new Date();
  const dateStr   = now.toISOString().replace("T"," ").substring(0,19);
  const dateLabel = now.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase();

  const emit = (text, type="normal") =>
    new Promise(r => setTimeout(() => { onLine({text, type}); r(); }, 0));

  await emit("=".repeat(60), "muted");
  await emit("  SATHYA AGENCIES — Live Review Tracker", "bold");
  await emit(`  Script : ${script.label}`, "muted");
  await emit(`  AGM    : ${script.agm}  (${script.branches.length} branches)`, "muted");
  await emit(`  Time   : ${dateStr}`, "muted");
  await emit("=".repeat(60), "muted");
  await emit("", "normal");

  try {
    const r = await fetch(`${SERVER}/status`, {signal: AbortSignal.timeout(8000)});
    if (!r.ok) throw new Error("HTTP " + r.status);
  } catch(e) {
    await emit("  ❌  Scraper server not reachable.", "error");
    await emit(`     ${e.message}`, "muted");
    await emit("  Make sure your Hugging Face Space is running.", "muted");
    await emit(`  Test: ${SERVER}/status`, "muted");
    await emit("=".repeat(60), "muted");
    return;
  }

  await emit(`  🌐 Playwright scraping ${script.agm} — ${script.branches.length} branches...`, "accent");
  await emit("", "normal");

  await new Promise(resolve => {
    const es = new EventSource(`${SERVER}/scrape/${encodeURIComponent(script.agm)}`);
    es.onmessage = e => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.event === "log")  onLine({text: msg.text, type: msg.type || "normal"});
      if (msg.event === "done") { es.close(); resolve(); }
    };
    es.onerror = () => {
      es.close();
      onLine({text: "  ⚠  Stream disconnected.", type: "error"});
      resolve();
    };
  });
}

function OutputLine({ text, type }) {
  const styles = {
    normal:  { color: "#1e293b" },
    muted:   { color: "#94a3b8" },
    bold:    { color: "#0f172a", fontWeight: 700 },
    success: { color: "#15803d" },
    error:   { color: "#b91c1c" },
    accent:  { color: "#1d4ed8" },
  };
  return (
    <div style={{
      fontFamily: "'Courier New', Courier, monospace",
      fontSize: "12.5px",
      lineHeight: "1.75",
      whiteSpace: "pre",
      ...styles[type || "normal"],
    }}>
      {text || "\u00a0"}
    </div>
  );
}

/* ── Excel helpers ─────────────────────────────────────────── */
function buildSheet(rows, label, baseline) {
  const headers = ["Branch", "Total Reviews", "Today's Reviews", "Stars", "Star Change", "Status"];
  const data = [headers, ...rows.map(r => {
    const prev      = (baseline && baseline[r.name]) || {};
    const prevRev   = prev.reviews || 0;
    const prevStar  = prev.stars   || 0;
    const today     = prevRev > 0 ? (r.reviews || 0) - prevRev : "no baseline";
    const starChange= (prevStar > 0 && r.stars > 0 && Math.abs(r.stars - prevStar) >= 0.1)
                      ? `${prevStar} → ${r.stars}` : "";
    return [
      r.name,
      r.reviews  || 0,
      typeof today === "number" ? (today >= 0 ? `+${today}` : `${today}`) : today,
      r.stars    || "—",
      starChange,
      r.status === "ok" ? "✓" : "FAILED",
    ];
  })];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws["!cols"] = [{wch:24},{wch:14},{wch:16},{wch:8},{wch:14},{wch:10}];
  const thin = {style:"thin",color:{rgb:"BBBBBB"}};
  const border = {top:thin,bottom:thin,left:thin,right:thin};
  for (let r=0;r<data.length;r++) for (let c=0;c<headers.length;c++) {
    const addr = XLSX.utils.encode_cell({r,c});
    if (!ws[addr]) ws[addr]={v:"",t:"s"};
    ws[addr].s = {
      border,
      alignment:{horizontal:"center",vertical:"center"},
      font: r===0 ? {bold:true,sz:11,color:{rgb:"FFFFFF"}} : {sz:11},
      fill: r===0
        ? {fgColor:{rgb:"1E3A5F"},patternType:"solid"}
        : r%2===0
          ? {fgColor:{rgb:"EEF2FA"},patternType:"solid"}
          : {fgColor:{rgb:"FFFFFF"},patternType:"solid"},
    };
  }
  return ws;
}

function downloadExcel(script, results, baseline) {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, buildSheet(results, script.agm, baseline), script.agm.substring(0,31));
  XLSX.writeFile(wb, `${script.agm}_reviews_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function downloadAllExcel(scripts, allResults, baseline) {
  const wb = XLSX.utils.book_new();
  scripts.forEach(s => {
    const rows = allResults[s.id];
    if (rows && rows.length) {
      XLSX.utils.book_append_sheet(wb, buildSheet(rows, s.agm, baseline), s.agm.substring(0,31));
    }
  });
  if (!wb.SheetNames.length) return;
  XLSX.writeFile(wb, `Sathya_All_Reviews_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function openPdf(script, results, baseline, baseDate) {
  const dateStr = new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase();
  const html    = buildPdfHtml(script, results, dateStr, baseline, baseDate);
  const blob    = new Blob([html],{type:"text/html;charset=utf-8"});
  const url     = URL.createObjectURL(blob);
  const win     = window.open(url,"_blank");
  if (win) win.addEventListener("load",()=>setTimeout(()=>URL.revokeObjectURL(url),3000));
  else { setTimeout(()=>URL.revokeObjectURL(url),10000); alert("Allow pop-ups and try again."); }
}

/* ── App ───────────────────────────────────────────────────── */
function App() {
  const runCounter  = useRef(0);
  const [selected,  setSelected]  = useState(new Set(ALL_SCRIPTS.map(s=>s.id)));
  const [allResults,setAllResults]= useState({});
  const [runAllBusy,setRunAllBusy]= useState(false);
  const [baseline,  setBaseline]  = useState({});   // { branchName: {reviews, stars, date} }
  const [baseDate,  setBaseDate]  = useState(null);
  const resolvers   = useRef({});

  // Load reviews.json on mount to get yesterday's snapshot as baseline
  React.useEffect(() => {
    fetch("data/reviews.json?t=" + Date.now())
      .then(r => r.ok ? r.json() : null)
      .then(D => {
        if (!D || !D.daily) return;
        // Find yesterday's date (IST = UTC+5:30)
        const nowIST  = new Date(Date.now() + (5.5 * 60 * 60 * 1000));
        const todayIST= nowIST.toISOString().slice(0, 10);
        // Get all dates before today, pick the most recent
        const dates   = Object.keys(D.daily).sort().reverse();
        const prevDate= dates.find(d => d < todayIST) || dates[0];
        if (!prevDate) return;
        const snap    = D.daily[prevDate] || {};
        // Build lookup: branch name → {reviews, stars}
        const bl = {};
        Object.entries(snap).forEach(([bid, val]) => {
          const branch = D.branches && D.branches[bid];
          if (branch) bl[branch.name] = { reviews: val.total_snap || 0, stars: val.star_rating || 0 };
        });
        setBaseline(bl);
        setBaseDate(prevDate);
      })
      .catch(() => {}); // silently ignore if file not found
  }, []);

  const allSelected  = selected.size === ALL_SCRIPTS.length;
  const someSelected = selected.size > 0 && !allSelected;
  const selectedIds  = ALL_SCRIPTS.filter(s=>selected.has(s.id)).map(s=>s.id);
  const doneIds      = selectedIds.filter(id=>allResults[id]);
  const allDone      = selectedIds.length > 0 && doneIds.length === selectedIds.length;

  const toggleSelect = (id) => setSelected(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const toggleAll    = () => setSelected(allSelected?new Set():new Set(ALL_SCRIPTS.map(s=>s.id)));

  const onDone = React.useCallback((id, rows) => {
    setAllResults(p=>({...p,[id]:rows}));
    if (resolvers.current[id]) { resolvers.current[id](); delete resolvers.current[id]; }
  },[]);

  const runAll = async () => {
    if (runAllBusy||selectedIds.length===0) return;
    setRunAllBusy(true);
    setAllResults(p=>{ const n={...p}; selectedIds.forEach(id=>{n[id]=null;}); return n; });
    for (const id of selectedIds) {
      if (cellRefs.current[id]) cellRefs.current[id]();
      await new Promise(res=>{ resolvers.current[id]=res; });
      await new Promise(r=>setTimeout(r,400));
    }
    setRunAllBusy(false);
  };

  const cellRefs = useRef({});
  const selectedScripts = ALL_SCRIPTS.filter(s=>selected.has(s.id));

  return (
    <div style={{minHeight:"100vh",background:"#f9fafb",fontFamily:"system-ui,-apple-system,sans-serif"}}>
      <style>{`
        @keyframes jupy-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes jupy-blink{0%,100%{opacity:1}50%{opacity:0}}
        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-track{background:#f1f5f9}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
      `}</style>

      {/* ── Toolbar ── */}
      <div style={{background:"white",borderBottom:"1px solid #e5e7eb",padding:"0 20px",display:"flex",alignItems:"center",gap:10,height:44,position:"sticky",top:40,zIndex:100,flexWrap:"wrap"}}>
        <img src="https://www.sathya.store/new_frontend/assets/img/sathya.webp" alt="Sathya" style={{height:26,objectFit:"contain"}} onError={e=>e.target.style.display="none"}/>
        <span style={{fontSize:"13px",fontWeight:700,color:"#0f172a",marginRight:4}}>Live Tracker</span>
        {baseDate && (
          <span style={{fontSize:"10px",color:"#94a3b8",fontFamily:"monospace",background:"#f1f5f9",padding:"2px 7px",borderRadius:4}}>
            baseline: {baseDate}
          </span>
        )}
        <div style={{width:1,height:20,background:"#e5e7eb"}}/>

        {/* Select All */}
        <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:"12px",fontWeight:600,color:"#374151",userSelect:"none"}}>
          <input type="checkbox" checked={allSelected}
            ref={el=>{if(el)el.indeterminate=someSelected;}}
            onChange={toggleAll}
            style={{width:14,height:14,accentColor:"#1d4ed8",cursor:"pointer"}}/>
          Select All
        </label>

        <div style={{width:1,height:20,background:"#e5e7eb"}}/>

        {/* Run All */}
        <button style={selectedIds.length===0||runAllBusy ? btnGray : btnDark}
          disabled={selectedIds.length===0||runAllBusy} onClick={runAll}>
          {runAllBusy
            ? <><svg width="12" height="12" viewBox="0 0 13 13" fill="none" style={{animation:"jupy-spin .9s linear infinite"}}><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" strokeWidth="1.5" strokeDasharray="18" strokeDashoffset="6"/></svg> Running…</>
            : <><svg width="10" height="11" viewBox="0 0 10 11" fill="currentColor"><path d="M1 1 L9 5.5 L1 10 Z"/></svg> Run All ({selectedIds.length})</>
          }
        </button>

        <div style={{width:1,height:20,background:"#e5e7eb"}}/>

        {/* Download All Excel */}
        <button style={allDone ? btnBlue : btnGray} disabled={!allDone}
          onClick={()=>downloadAllExcel(selectedScripts,allResults,baseline)}>
          <svg width="11" height="11" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v7M4 6l2.5 2.5L9 6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><path d="M2 10h9" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
          Download All Excel {allDone?`(${doneIds.length})`:""}
        </button>

        {/* Download All PDF */}
        <button style={allDone ? {...btnBase,background:"#e11d48",color:"#fff"} : btnGray}
          disabled={!allDone}
          onClick={()=>openAllPdf(selectedScripts,allResults,baseline,baseDate)}>
          Download All PDF
        </button>

        <div style={{flex:1}}/>
        <div style={{fontSize:"11px",color:"#94a3b8",fontFamily:"monospace",display:"flex",alignItems:"center",gap:6}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:"#22c55e"}}/>
          Python 3 (ipykernel)
        </div>
      </div>

      {/* ── Notebook ── */}
      <div style={{maxWidth:"960px",margin:"0 auto",padding:"24px 16px 60px"}}>
        <div style={{display:"flex",gap:0,marginBottom:"0px"}}>
          <div style={{width:56,flexShrink:0}}/>
          <div style={{flex:1,padding:"10px 16px",background:"white",border:"1px solid #e5e7eb",borderLeft:"4px solid #3b82f6",borderRadius:"4px",marginBottom:"2px"}}>
            <div style={{fontSize:"18px",fontWeight:700,color:"#0f172a",marginBottom:4}}>🏪 Google Review Tracker</div>
            <div style={{fontSize:"12.5px",color:"#64748b",fontFamily:"monospace"}}>Playwright · Chromium Headless · Tamil Nadu Branches · Live scrape</div>
          </div>
        </div>
        <div style={{height:12}}/>

        {/* ── ALL BRANCHES (flat) cell ── */}
        <CellWrapper
          key={ALL_BRANCHES_SCRIPT.id}
          script={ALL_BRANCHES_SCRIPT}
          runCount={runCounter}
          selected={selected.has(ALL_BRANCHES_SCRIPT.id)}
          onSelect={toggleSelect}
          onDone={onDone}
          cellRefs={cellRefs}
          baseline={baseline}
          baseDate={baseDate}
        />

        {/* ── Divider between flat and grouped ── */}
        <div style={{display:"flex",alignItems:"center",gap:12,margin:"20px 0 16px"}}>
          <div style={{width:56,flexShrink:0}}/>
          <div style={{flex:1,height:1,background:"#e5e7eb"}}/>
          <span style={{fontSize:"11px",fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"1px",whiteSpace:"nowrap",flexShrink:0}}>By AGM</span>
          <div style={{flex:1,height:1,background:"#e5e7eb"}}/>
        </div>

        {/* ── Grouped cells by AGM ── */}
        {SCRIPTS.map((script,i)=>(
          <CellWrapper
            key={script.id}
            script={script}
            runCount={runCounter}
            selected={selected.has(script.id)}
            onSelect={toggleSelect}
            onDone={onDone}
            cellRefs={cellRefs}
            baseline={baseline}
            baseDate={baseDate}
          />
        ))}
      </div>
    </div>
  );
}

/* Wrapper so each Cell can expose its run fn via ref */
function CellWrapper({script, runCount, selected, onSelect, onDone, cellRefs, baseline, baseDate}) {
  const runRef = useRef(null);
  React.useEffect(()=>{ cellRefs.current[script.id] = ()=>{ if(runRef.current) runRef.current(); }; },[]);
  return <div style={{marginBottom:"3px"}}><Cell script={script} runCount={runCount} selected={selected} onSelect={onSelect} onDone={onDone} runRef={runRef} baseline={baseline} baseDate={baseDate}/></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
