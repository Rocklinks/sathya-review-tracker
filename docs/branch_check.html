<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Branch Attendance Checker</title>

<!-- Favicon Added -->
<link rel="icon" type="image/webp" href="https://www.sathya.store/favicon.webp">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 0;
  }

  /* Navigation */
  .sa-nav {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .sa-nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 18px;
    color: #1a1a1a;
  }
  .sa-nav-brand img { height: 36px; width: auto; }
  .sa-nav-links {
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .sa-nav-links a {
    text-decoration: none;
    color: #444;
    font-size: 15px;
    font-weight: 500;
    transition: color 0.2s;
  }
  .sa-nav-links a:hover { color: #0F6E56; }
  .sa-nav-links a.active {
    color: #0F6E56;
    font-weight: 600;
    position: relative;
  }
  .sa-nav-links a.active::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #0F6E56;
  }

  /* Main Content */
  .container {
    max-width: 720px;
    margin: 40px auto;
    padding: 0 15px;
  }
  .card {
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
  .sub {
    font-size: 14.8px;
    color: #666;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    font-family: ui-monospace, monospace;
    font-size: 14.8px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    resize: vertical;
    background: #fff;
    line-height: 1.7;
  }
  textarea:focus {
    outline: none;
    border-color: #0F6E56;
    box-shadow: 0 0 0 3px rgba(15, 110, 86, 0.12);
  }
  .btn {
    margin-top: 16px;
    padding: 13px 34px;
    font-size: 15.5px;
    font-weight: 600;
    background: #0F6E56;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: #0a5a47; transform: translateY(-1px); }

  .results { margin-top: 30px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px;
    margin-bottom: 26px;
  }
  .stat {
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 12px;
    padding: 18px 20px;
    text-align: center;
  }
  .stat-label { font-size: 12.8px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.6px; }
  .stat-val { font-size: 29px; font-weight: 700; }
  .stat-val.green { color: #0F6E56; }
  .stat-val.red { color: #993C1D; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin: 28px 0 12px;
  }
  .branch-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .branch-list li {
    font-size: 15px;
    padding: 11px 16px;
    border-radius: 8px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: #f9f9f7;
  }
  .branch-list li .num {
    font-size: 13.5px;
    color: #999;
    min-width: 28px;
    text-align: right;
  }
  .branch-list.missing li { background: #FAECE7; color: #712B13; }
  .branch-list.present li { background: #EAF3DE; color: #27500A; }
  .branch-list.unrecognized li { background: #FAF4E6; color: #6B4E1F; }

  .empty { font-size: 15px; color: #0F6E56; font-style: italic; padding: 14px 0; }
  hr { border: none; border-top: 1px solid #eee; margin: 30px 0; }
</style>
</head>
<body>

<nav class="sa-nav">
  <div class="sa-nav-brand">
    <img src="https://www.sathya.store/new_frontend/assets/img/sathya.webp" alt="Sathya" onerror="this.style.display='none'">
    <span>SATHYA AGENCIES</span>
  </div>
  <div class="sa-nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="sathya_jupyter.html">💻 Live Tracker</a>
    <a href="sathya-weather.html">⛅ Weather</a>
    <a href="Enquiries_Filter_Tool.html">📊 PDF Tool</a>
    <a href="branch_check.html" class="active"><span class="s-icon">🔍</span> Branch Check</a>
  </div>
</nav>

<div class="container">
  <div class="card">
    <h1>Branch Attendance Checker</h1>
    <p class="sub">
      Paste either <strong>Branch Names</strong> or <strong>Branch Codes</strong>.<br>
      The tool will automatically detect and check missing items from the correct list.
    </p>
    
    <textarea id="inp" placeholder="TVL1&#10;TUT1&#10;TUT2&#10;VNR1&#10;&#10;Or paste branch names like:&#10;Tirunelveli&#10;Tuticorin 1&#10;Paramakudi"></textarea>
    
    <button class="btn" onclick="check()">Check Missing Branches</button>
    
    <div class="results" id="results" style="display:none;"></div>
  </div>
</div>

<script>
// ==================== MASTER DATA ====================
const MASTER_NAMES = [
  "Tuticorin 1","Tuticorin 2","Thiruchendur","Thisayanvilai","Eral","Udangudi",
  "Tirunelveli","Valliyur","Ambasamudram","Anjugramam","Nagercoil","Marthandam",
  "Thuckalay","Colachel","Kulasekharam","Monday market","Karungal","Kovilpatti",
  "Ramnad","Paramakudi","Sayalkudi","Villathikulam","Sattur","Sankarankovil",
  "Kayathar","Tenkasi 1","Tenkasi 2","Surandai","Puliyangudi","Sengottai",
  "Rajapalayam","Virudhunagar1","Virudhunagar2","Aruppukottai 1","Aruppukottai 2","Sivakasi"
];

const MASTER_CODES = [
  "APK1","APK2","ARM1","ASM1","COL1","ERL2","KGL1","KSM1","KVT1","KYR1",
  "MAR1","MMT1","NGR1","PDI1","PKD1","RND1","RPM1","SDI1","SGT1","SKD1",
  "SNL1","STU2","SVK1","TCN1","TKS1","TKS2","TKY1","TUT1","TUT2","TVL1",
  "TYI1","UDN1","VKM1","VLY1","VNR1","VNR2"
];

// Normalization
function normalize(s) {
  return s.toLowerCase().trim().replace(/\s+/g, '');
}

function isCode(input) {
  const n = normalize(input);
  return MASTER_CODES.some(code => normalize(code) === n);
}

function check() {
  const raw = document.getElementById('inp').value.trim();
  if (!raw) return;

  const lines = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  if (lines.length === 0) return;

  // Auto detect: if any input matches a code → treat as codes
  let isCodeInput = lines.some(line => isCode(line));

  const MASTER = isCodeInput ? MASTER_CODES : MASTER_NAMES;
  const title = isCodeInput ? "Branch Codes" : "Branch Names";

  const matched = new Set();
  const unrecognized = [];

  lines.forEach(line => {
    const n = normalize(line);
    const found = MASTER.find(item => normalize(item) === n);
    if (found) {
      matched.add(found);
    } else {
      unrecognized.push(line);
    }
  });

  const missing = MASTER.filter(b => !matched.has(b));
  const present = Array.from(matched);

  const resEl = document.getElementById('results');
  resEl.style.display = 'block';

  let html = `
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total ${title}</div>
        <div class="stat-val">${MASTER.length}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Present</div>
        <div class="stat-val green">${present.length}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Missing</div>
        <div class="stat-val red">${missing.length}</div>
      </div>
    </div>`;

  html += `<div class="section-title">Missing ${title} (${missing.length})</div>`;
  if (missing.length === 0) {
    html += `<span class="empty">✅ All ${title.toLowerCase()} accounted for!</span>`;
  } else {
    html += `<ul class="branch-list missing">`;
    missing.forEach((b, i) => html += `<li><span class="num">${i+1}.</span> ${b}</li>`);
    html += `</ul>`;
  }

  if (unrecognized.length > 0) {
    html += `<hr><div class="section-title">Unrecognized Entries (${unrecognized.length})</div>`;
    html += `<ul class="branch-list unrecognized">`;
    unrecognized.forEach((b, i) => html += `<li><span class="num">${i+1}.</span> ${b}</li>`);
    html += `</ul>`;
  }

  html += `<hr><div class="section-title">Present ${title} (${present.length})</div>`;
  html += `<ul class="branch-list present">`;
  present.forEach((b, i) => html += `<li><span class="num">${i+1}.</span> ${b}</li>`);
  html += `</ul>`;

  resEl.innerHTML = html;
}
</script>
</body>
</html>
