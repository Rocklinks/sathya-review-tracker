<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Branch Attendance Checker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f3; color: #1a1a1a; min-height: 100vh;
    display: flex; justify-content: center; padding: 2rem 1rem;
  }
  .container { width: 100%; max-width: 680px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
  textarea {
    width: 100%; min-height: 180px; font-family: monospace; font-size: 13px;
    border: 1px solid #ddd; border-radius: 8px; padding: 12px;
    resize: vertical; background: #fff; color: #1a1a1a; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: #999; }
  .btn {
    margin-top: 12px; padding: 9px 22px; font-size: 14px; font-weight: 500;
    background: #fff; border: 1px solid #ccc; border-radius: 8px;
    cursor: pointer; color: #1a1a1a; transition: background 0.15s;
  }
  .btn:hover { background: #f0f0ee; }
  .btn:active { transform: scale(0.98); }
  .results { margin-top: 1.75rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  .stat { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px 14px; }
  .stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .stat-val { font-size: 24px; font-weight: 600; color: #1a1a1a; }
  .stat-val.green { color: #0F6E56; }
  .stat-val.red { color: #993C1D; }
  .section-title {
    font-size: 11px; font-weight: 600; color: #888;
    text-transform: uppercase; letter-spacing: 0.05em; margin: 1.25rem 0 8px;
  }
  .branch-list { list-style: none; padding: 0; margin: 0; }
  .branch-list li {
    font-size: 14px; padding: 7px 12px; border-radius: 6px;
    margin-bottom: 4px; display: flex; align-items: center; gap: 10px;
  }
  .branch-list li .num { font-size: 12px; color: #aaa; min-width: 22px; text-align: right; }
  .branch-list.missing li { background: #FAECE7; color: #712B13; }
  .branch-list.present li { background: #EAF3DE; color: #27500A; }
  .branch-list.unrecognized li { background: #FAEEDA; color: #633806; }
  .empty { font-size: 13px; color: #888; font-style: italic; }
  hr { border: none; border-top: 1px solid #e8e8e8; margin: 1.25rem 0; }
  .card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 1.5rem; }
</style>
</head>
<body>
<!-- Site Nav -->
<nav class="sa-nav">
  <div class="sa-nav-brand">
    <img src="https://www.sathya.store/new_frontend/assets/img/sathya.webp" alt="Sathya" onerror="this.style.display='none'">
    <span>SATHYA AGENCIES</span>
  </div>
  <div class="sa-nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="sathya_jupyter.html">💻 Live Tracker</a>
    <a href="sathya-weather.html">⛅ Weather</a>
    <a href="Enquiries_Filter_Tool.html" class="active">📊 Pdf Tool</a>
    <a href="branch_check.html"><span class="s-icon">&#x1F50D;</span> Branch Track</a>
  </div>
</nav>
<div class="container">
  <div class="card">
    <h1>Branch Attendance Checker</h1>
    <p class="sub">Paste the branch names (one per line or comma-separated). Missing branches will be highlighted.</p>
    <textarea id="inp" placeholder="Tuticorin1&#10;Tirunelveli1&#10;Paramakudi&#10;Karungal&#10;..."></textarea>
    <button class="btn" onclick="check()">Check Missing Branches</button>
    <div class="results" id="results" style="display:none;"></div>
  </div>
</div>
<script>
const MASTER = [
  "Tuticorin 1","Tuticorin 2","Thiruchendur","Thisayanvilai","Eral","Udangudi",
  "Tirunelveli","Valliyur","Ambasamudram","Anjugramam","Nagercoil","Marthandam",
  "Thuckalay","Colachel","Kulasekharam","Monday market","Karungal","Kovilpatti",
  "Ramnad","Paramakudi","Sayalkudi","Villathikulam","Sattur","Sankarankovil",
  "Kayathar","Tenkasi 1","Tenkasi 2","Surandai","Puliyangudi","Sengottai",
  "Rajapalayam","Virudhunagar1","Virudhunagar2","Aruppukottai 1","Aruppukottai 2","Sivakasi"
];

function normalize(s) {
  return s.toLowerCase()
    .replace(/\s+/g, '')
    .replace(/mondaymarket/, 'mondaymarket')
    .replace(/aruppukottai\s*1/, 'aruppukottai1')
    .replace(/aruppukottai\s*2/, 'aruppukottai2')
    .replace(/arupukottai\s*1/, 'aruppukottai1')
    .replace(/arupukottai\s*2/, 'aruppukottai2')
    .replace(/virudhunagar\s*1/, 'virudhunagar1')
    .replace(/virudhunagar\s*2/, 'virudhunagar2')
    .replace(/tenkasi\s*1/, 'tenkasi1')
    .replace(/tenkasi\s*2/, 'tenkasi2')
    .replace(/tuticorin\s*1/, 'tuticorin1')
    .replace(/tuticorin\s*2/, 'tuticorin2');
}

const masterNorm = MASTER.map(b => ({ original: b, norm: normalize(b) }));

function findMaster(input) {
  const n = normalize(input);
  return masterNorm.find(b => b.norm === n);
}

function check() {
  const raw = document.getElementById('inp').value.trim();
  if (!raw) return;
  const lines = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);

  const matched = new Set();
  const unrecognized = [];

  lines.forEach(line => {
    const found = findMaster(line);
    if (found) matched.add(found.original);
    else unrecognized.push(line);
  });

  const missing = MASTER.filter(b => !matched.has(b));
  const present = MASTER.filter(b => matched.has(b));

  const resEl = document.getElementById('results');
  resEl.style.display = 'block';

  let html = `<div class="stats">
    <div class="stat"><div class="stat-label">Total branches</div><div class="stat-val">${MASTER.length}</div></div>
    <div class="stat"><div class="stat-label">Present</div><div class="stat-val green">${present.length}</div></div>
    <div class="stat"><div class="stat-label">Missing</div><div class="stat-val red">${missing.length}</div></div>
  </div>`;

  html += `<div class="section-title">Missing branches (${missing.length})</div>`;
  if (missing.length === 0) html += `<span class="empty">All branches accounted for!</span>`;
  else {
    html += `<ul class="branch-list missing">`;
    missing.forEach((b, i) => html += `<li><span class="num">${i+1}.</span>${b}</li>`);
    html += `</ul>`;
  }

  if (unrecognized.length > 0) {
    html += `<hr><div class="section-title">Unrecognized entries (${unrecognized.length})</div>`;
    html += `<ul class="branch-list unrecognized">`;
    unrecognized.forEach((b, i) => html += `<li><span class="num">${i+1}.</span>${b}</li>`);
    html += `</ul>`;
  }

  html += `<hr><div class="section-title">Present branches (${present.length})</div>`;
  html += `<ul class="branch-list present">`;
  present.forEach((b, i) => html += `<li><span class="num">${i+1}.</span>${b}</li>`);
  html += `</ul>`;

  resEl.innerHTML = html;
}
</script>
</body>
</html>
